[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-doc-inference"
version = "0.1.0"
description = "LLM pipeline that answers clinical documentation questions from patient records, with evidence grounding, abstention, and evaluation against annotated data."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]
eval = [
    "langsmith>=0.2",
    "ragas>=0.2",
    "deepeval>=1.0",
]
dev = ["pytest>=8"]

[project.scripts]
clinical-doc = "clinical_doc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
